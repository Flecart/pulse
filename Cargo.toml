[package]
name = "pulse"
version = "0.1.0"
edition = "2024"
description = "A tiny self-hosted health monitor: HTTP/TCP/DNS/systemd/host-metric checks, one status page, ntfy + email alerts"
license = "MIT"
repository = "https://github.com/Flecart/pulse"
readme = "README.md"
keywords = ["monitoring", "uptime", "healthcheck", "systemd", "selfhosted"]
categories = ["command-line-utilities"]
rust-version = "1.95"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "process", "io-util", "signal", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
hickory-resolver = { version = "0.24", default-features = false, features = ["tokio-runtime"] }
x509-parser = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sd-notify = "0.4"
libc = "0.2"
# Same rustls as reqwest, so pulse can hand it a config with session resumption OFF.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
webpki-roots = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
